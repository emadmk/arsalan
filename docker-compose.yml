services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: persian_carpet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: persian_carpet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: persian_carpet_backend
    restart: unless-stopped
    environment:
      # Server
      NODE_ENV: production
      PORT: ${PORT:-5000}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: persian_carpet_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d

      # NOWPayments
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}

      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!@#}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend/certificates:/app/certificates
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:5000}
    container_name: persian_carpet_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: persian_carpet_network
